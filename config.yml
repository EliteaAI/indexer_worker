event_node:
  type: MockEventNode

task_limit: null

nltk_data: /tmp/nltk_data
tasknode_tmp: /tmp/tasknode

# Coalesce streamed agent_llm_chunk token-deltas into fewer, larger emits.
# Reduces Redis/pickle/sio/UI work per streamed response. Set enabled: false
# to revert to per-delta emits.
llm_chunk_batching:
  enabled: true
  max_chars: 64
  max_interval_ms: 80

# Model-name substrings whose reasoning effort must be sent as a nested
# `reasoning: {effort}` body object instead of top-level `reasoning_effort`.
# Needed for Bedrock-hosted OpenAI models, which reject both forms LiteLLM emits.
# reasoning_in_body_for: ["gpt-5.6"]

# Default issue #6264 mode. Keeps one agent process per root fan-out and resumes
# exact child HITLs over the live decision router. The existing process-per-child
# parallel_subagent_dispatch mode remains a separate explicit override.
independent_parallel_hitl: true
parallel_hitl_max_concurrency: 8

# Bound oversized tool results before they reach state / events / DB / LLM context (#6140).
# Live-reloadable: an admin save applies to the next agent run, no restart needed.
# Set false to disable every check and pass results through unchanged, exactly as before.
allow_tool_call_truncation: true
tool_call_truncation_limit: 200000   # CHARACTERS, aligned with the SDK bounded-read cap

# Per-toolkit-type overrides of the limit above, for toolkits whose large output is
# legitimate (retrieval, exports). Absent entry => the global limit applies.
tool_call_truncation_limit_per_toolkit: {}
  #  pgvector: 400000
  #  sharepoint: 400000

# Wire-level cap on a single MCP HTTP response BODY, in bytes (#6141). Different job
# from the character limit above: this one stops an oversized body from ever being
# allocated, so a malformed/malicious MCP server cannot OOM the worker. Kept far above
# the char cap because tool-discovery catalogues are legitimately large.
# Two switches: allow_tool_call_truncation is the whole-feature kill switch, while
# allow_mcp_response_cap disables ONLY this wire cap - so reverting a truncation
# complaint does not also disarm the OOM guard, and vice versa.
# Default 50 MiB: clears the largest tools/list catalogue observed in production
# (21.9 MB) with margin, while rejecting pathological bodies. Sending
# Accept-Encoding: identity keeps this count equal to decoded payload bytes.
allow_mcp_response_cap: false   # opt-in; enable once proven against real traffic
mcp_response_max_bytes: 52428800   # 50 MiB

# Pyodide code-node sandbox resource limits. Set into os.environ at plugin init
# (see module.py env_vars loop) and read by PyodideSandboxTool in the SDK.
# Values MUST be strings (os.environ requires str). Absent => SDK safe defaults.
#   SANDBOX_MAX_CONCURRENT: "0"      disables the concurrency gate
#   SANDBOX_MEMORY_PRESSURE_PCT: "0" disables the memory-pressure gate
#
# TLS trust overrides for sandbox outbound HTTPS. Both DEFAULT EMPTY = feature
# OFF (the deno run flag is only appended when the var is non-empty):
#   PYODIDE_ROOT_CA_PATH     SECURE. Absolute path to a PEM root CA file,
#                            readable inside the container, that Deno trusts via
#                            `--cert=<path>`. Takes precedence over
#                            ALLOWED_PYODIDE_DOMAINS — prefer this whenever the
#                            org's root CA can be mounted into the container.
#   ALLOWED_PYODIDE_DOMAINS  UNSAFE FALLBACK, used only when PYODIDE_ROOT_CA_PATH
#                            is unset. Comma-separated hostnames that BYPASS TLS
#                            certificate validation via Deno's
#                            `--unsafely-ignore-certificate-errors=<list>`.
#                            Scoped to the listed hosts, but validation is fully
#                            disabled for them — use only when distributing the
#                            root CA is not feasible.
env_vars:
  SANDBOX_TIMEOUT_SECONDS: "55"       # per-execution wall-clock kill
  SANDBOX_WASM_MAX_MEM_MB: "512"      # per-execution Pyodide WASM heap cap
  SANDBOX_MAX_CONCURRENT: "16"        # max concurrent deno sandboxes (per pod)
  SANDBOX_MEMORY_PRESSURE_PCT: "85"   # reject new runs above this container mem %
  PYODIDE_ROOT_CA_PATH: ""            # secure: PEM path -> --cert (default off)
  ALLOWED_PYODIDE_DOMAINS: ""         # unsafe fallback: comma-separated hosts -> --unsafely-ignore-certificate-errors (default off)
